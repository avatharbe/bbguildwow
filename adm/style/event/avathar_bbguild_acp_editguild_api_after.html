{% if GAME_ID == 'wow' %}
<dl>
    <dt><label>{{ lang('ARMORY_URL') }}:</label></dt>
    <dd><a href="{{ ARMORY_URL }}">{{ ARMORY_URL }}</a></dd>
</dl>
<dl id="wow-sync-log" style="display:none;">
    <dt><label>{{ lang('WOW_SYNC_PROGRESS') }}:</label></dt>
    <dd>
        <ul id="wow-sync-phases" style="list-style:none;margin:0;padding:0;font-size:0.9em;"></ul>
    </dd>
</dl>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var rosterUrl = '{{ U_ROSTER_SYNC }}';
    var specUrl = '{{ U_SPEC_SYNC }}';
    var portraitUrl = '{{ U_PORTRAIT_SYNC }}';
    var equipmentUrl = '{{ U_EQUIPMENT_SYNC }}';
    var logRow = document.getElementById('wow-sync-log');
    var phases = document.getElementById('wow-sync-phases');
    var armoryBtn = document.querySelector('input[name="armory"]');
    var currentLi = null;

    function startPhase(name) {
        logRow.style.display = '';
        var li = phases.querySelector('li[data-phase="' + name + '"]');
        if (!li) {
            li = document.createElement('li');
            li.style.padding = '2px 0';
            li.dataset.phase = name;
            phases.appendChild(li);
        }
        li.innerHTML = '<strong>' + name + ':</strong> <span class="phase-status">...</span>';
        currentLi = li;
    }

    function updatePhase(text) {
        if (currentLi) currentLi.querySelector('.phase-status').textContent = text;
    }

    function completePhase(text) {
        if (currentLi) currentLi.querySelector('.phase-status').textContent = text;
    }

    function runBatchPhase(name, url, next) {
        startPhase(name);
        fetchBatch(url, next);
    }

    // maxStalls: give up after this many consecutive polls report the exact
    // same "remaining" count -- without this, a batch that can never fully
    // resolve (e.g. a character whose lookup keeps failing) polls forever,
    // since done only ever becomes true when remaining reaches 0. The
    // sync_one_equipment()/sync_one_specs()/sync_one_portrait() sentinel
    // fixes on the server side address the common case (a genuine 404),
    // but this is a client-side safety net for anything else that could
    // leave "remaining" stuck.
    var MAX_STALLS = 5;

    function fetchBatch(url, next, lastRemaining, stallCount) {
        stallCount = stallCount || 0;
        fetch(url).then(function(r) { return r.json(); }).then(function(data) {
            if (data.error) { completePhase(data.error); if (next) next(); return; }
            var done = data.remaining === 0 || data.done;
            var synced = data.total - (data.remaining || 0);

            if (!done && data.remaining === lastRemaining)
            {
                stallCount++;
            }
            else if (!done)
            {
                stallCount = 0;
            }

            if (!done && stallCount >= MAX_STALLS) {
                completePhase(synced + ' / ' + data.total + ' \u2014 ' + data.remaining + ' could not be synced after repeated attempts, giving up');
                if (next) next();
                return;
            }

            updatePhase(synced + ' / ' + data.total);
            if (!done) {
                fetchBatch(url, next, data.remaining, stallCount);
            } else {
                completePhase(synced + ' / ' + data.total + ' \u2713');
                if (next) next();
            }
        }).catch(function() {
            completePhase('Error');
            if (next) next();
        });
    }

    // Shared guard: the manual "Update Ranks and Players" button and the
    // auto-sync-on-load block below both start phases through this same
    // panel; without a shared flag, a page reload landing mid-sync (specs
    // or portraits still incomplete server-side) starts its own polling
    // chain that the button click below can't see, and vice versa -- two
    // independent chains end up racing for the same phase, each polling
    // for real but only one visibly progressing (the other's <li> stuck
    // at "...").
    function beginSync() {
        if (armoryBtn) armoryBtn.disabled = true;
    }

    function endSync() {
        if (armoryBtn) armoryBtn.disabled = false;
    }

    function syncAll() {
        if (armoryBtn && armoryBtn.disabled) return;
        phases.innerHTML = '';
        beginSync();

        startPhase('{{ lang('WOW_PHASE_ROSTER') }}');
        updatePhase('...');

        fetch(rosterUrl).then(function(r) { return r.json(); }).then(function(data) {
            if (!data.success) {
                completePhase(data.message || 'Error');
                endSync();
                return;
            }
            completePhase(data.message + ' \u2713');

            runBatchPhase('{{ lang('WOW_PHASE_SPECS') }}', specUrl, function() {
                runBatchPhase('{{ lang('WOW_PHASE_PORTRAITS') }}', portraitUrl, function() {
                    runBatchPhase('{{ lang('WOW_PHASE_EQUIPMENT') }}', equipmentUrl, function() {
                        endSync();
                    });
                });
            });
        }).catch(function(err) {
            completePhase('Error: ' + err.message);
            endSync();
        });
    }

    if (armoryBtn) {
        armoryBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            syncAll();
        });
    }

    // Auto-sync missing specs and portraits on page load -- guarded by the
    // same armoryBtn.disabled flag as syncAll() so a reload landing
    // mid-sync doesn't start a second, independent polling chain.
    if (!armoryBtn || !armoryBtn.disabled) {
        beginSync();
        fetch(specUrl).then(function(r) { return r.json(); }).then(function(specData) {
            var needSpecs = !specData.done && specData.remaining > 0;
            fetch(portraitUrl).then(function(r) { return r.json(); }).then(function(portData) {
                var needPortraits = !portData.done && portData.remaining > 0;
                if (needSpecs) {
                    runBatchPhase('{{ lang('WOW_PHASE_SPECS') }}', specUrl, function() {
                        if (needPortraits) {
                            runBatchPhase('{{ lang('WOW_PHASE_PORTRAITS') }}', portraitUrl, endSync);
                        } else {
                            endSync();
                        }
                    });
                } else if (needPortraits) {
                    runBatchPhase('{{ lang('WOW_PHASE_PORTRAITS') }}', portraitUrl, endSync);
                } else {
                    endSync();
                }
            });
        });
    }
});
</script>
{% endif %}
