{% if GAME_ID == 'wow' %}
<dl>
    <dt style="width: 35%;"><label>{{ lang('WOW_SYNC_ACHIEVEMENTS_LABEL') }}</label>
        <br /><span>{{ lang('WOW_SYNC_ACHIEVEMENTS_EXPLAIN') }}</span>
    </dt>
    <dd>
        <input type="button" id="achiev_sync_btn" value="{{ lang('WOW_SYNC_ACHIEVEMENTS_LABEL') }}" class="button1" style="padding: 8px 20px; font-size: 1.1em;" />
    </dd>
</dl>
<dl id="wow-achiev-sync-log" style="display:none;">
    <dt><label>{{ lang('WOW_SYNC_PROGRESS') }}:</label></dt>
    <dd>
        <ul id="wow-achiev-sync-phases" style="list-style:none;margin:0;padding:0;font-size:0.9em;"></ul>
    </dd>
</dl>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var categoryUrl = '{{ U_CATEGORY_SYNC }}';
    var achievUrl = '{{ U_ACHIEV_SYNC }}';
    var playerAchievUrl = '{{ U_PLAYER_ACHIEV_SYNC }}';
    var logRow = document.getElementById('wow-achiev-sync-log');
    var phases = document.getElementById('wow-achiev-sync-phases');
    var btn = document.getElementById('achiev_sync_btn');
    var currentLi = null;

    function startPhase(name) {
        logRow.style.display = '';
        var li = document.createElement('li');
        li.style.padding = '4px 0';
        li.innerHTML = '<strong>' + name + ':</strong> ' +
            '<progress class="phase-progress" max="100" value="0" style="width:200px;vertical-align:middle;margin:0 8px;"></progress>' +
            '<span class="phase-status">...</span>';
        phases.appendChild(li);
        currentLi = li;
    }

    // percent is omitted on error/pre-fetch states, where there's nothing
    // meaningful to show on the bar yet -- it's left at whatever it last was.
    function updatePhase(text, percent) {
        if (!currentLi) return;
        currentLi.querySelector('.phase-status').textContent = text;
        if (typeof percent === 'number') {
            currentLi.querySelector('.phase-progress').value = percent;
        }
    }

    function completePhase(text, percent) {
        updatePhase(text, percent);
    }

    // maxStalls: give up after this many consecutive polls report the exact
    // same "remaining" count -- without this, a batch that can never fully
    // resolve (e.g. one category Battle.net consistently errors on) polls
    // forever, since done only ever becomes true when remaining reaches 0.
    // Confirmed live: 761 identical requests over 24 minutes stuck on
    // "remaining: 2" with no give-up condition at all.
    var MAX_STALLS = 5;

    function fetchBatch(url, next, lastRemaining, stallCount) {
        stallCount = stallCount || 0;
        fetch(url).then(function(r) { return r.json(); }).then(function(data) {
            if (data.error) { completePhase(data.error); if (next) next(); return; }
            var done = data.remaining === 0 || data.done;
            var synced = data.total - (data.remaining || 0);
            var percent = data.total > 0 ? Math.round(synced / data.total * 100) : 100;
            if (!done) {
                if (data.remaining === lastRemaining) {
                    stallCount++;
                } else {
                    stallCount = 0;
                }

                if (stallCount >= MAX_STALLS) {
                    completePhase(synced + ' / ' + data.total + ' \u2014 ' + data.remaining + ' could not be synced after repeated attempts, giving up', percent);
                    if (next) next();
                    return;
                }

                updatePhase(synced + ' / ' + data.total + ' (' + percent + '%)', percent);
                fetchBatch(url, next, data.remaining, stallCount);
            } else {
                completePhase(synced + ' / ' + data.total + ' (100%) \u2713', 100);
                if (next) next();
            }
        }).catch(function() {
            completePhase('Error');
            if (next) next();
        });
    }

    function runBatchPhase(name, url, next) {
        startPhase(name);
        fetchBatch(url, next);
    }

    if (btn) {
        btn.addEventListener('click', function() {
            phases.innerHTML = '';
            btn.disabled = true;

            runBatchPhase('{{ lang('WOW_PHASE_CATEGORIES') }}', categoryUrl, function() {
                runBatchPhase('{{ lang('WOW_PHASE_ACHIEVEMENTS') }}', achievUrl, function() {
                    runBatchPhase('{{ lang('WOW_PHASE_PLAYER_ACHIEVEMENTS') }}', playerAchievUrl, function() {
                        btn.disabled = false;
                    });
                });
            });
        });
    }
});
</script>
{% endif %}
