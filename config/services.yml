imports:
    - { resource: tables.yml }

services:
    avathar.bbguildwow.installer:
        class: avathar\bbguildwow\game\wow_installer
        arguments:
            - '@dbal.conn'
            - '@cache.driver'
            - '@config'
            - '@user'

    avathar.bbguildwow.api:
        class: avathar\bbguildwow\game\wow_api
        arguments:
            - '@cache'
            - '@dbal.conn'
            - '%avathar.bbguildwow.tables.bb_guild_wow%'
            - '%avathar.bbguild.tables.bb_players%'
            - '%avathar.bbguild.tables.bb_ranks%'
            - '@filesystem'
        calls:
            - [set_language, ['@language']]

    avathar.bbguildwow.provider:
        class: avathar\bbguildwow\game\wow_provider
        arguments:
            - '@avathar.bbguildwow.installer'
            - '@avathar.bbguildwow.api'
            - '@ext.manager'
        calls:
            - [set_language, ['@language']]
        tags:
            - { name: bbguild.game_provider }

    avathar.bbguildwow.character_sync_handler:
        class: avathar\bbguildwow\sync\character_sync_handler
        arguments:
            - '@avathar.bbguildwow.api'
            - '@dbal.conn'
            - '@upload_imagesize'
            - '%avathar.bbguild.tables.bb_players%'
        tags:
            - { name: bbguild.character_sync }

    # --- Avatar ---

    avathar.bbguildwow.avatar.driver.character:
        class: avathar\bbguildwow\avatar\character_avatar_driver
        arguments:
            - '@config'
            - '@upload_imagesize'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@path_helper'
            - '@cache.driver'
        calls:
            - [set_name, [avatar.driver.bbguildwow_character]]
        tags:
            - { name: avatar.driver }

    avathar.bbguildwow.listener:
        class: avathar\bbguildwow\event\listener
        arguments:
            - '@config'
            - '@template'
            - '@dbal.conn'
            - '@request'
            - '@controller.helper'
            - '@language'
            - '%avathar.bbguildwow.tables.bb_guild_wow%'
            - '%avathar.bbguild.tables.bb_players%'
        tags:
            - { name: event.listener }

    avathar.bbguildwow.asset_controller:
        class: avathar\bbguildwow\controller\asset_controller
        arguments:
            - '@dbal.conn'
            - '@language'
            - '%core.root_path%'
            - '%avathar.bbguild.tables.bb_guild%'
            - '%avathar.bbguild.tables.bb_players%'

    avathar.bbguildwow.portrait_controller:
        class: avathar\bbguildwow\controller\portrait_controller
        arguments:
            - '@avathar.bbguildwow.api'
            - '@dbal.conn'
            - '@avathar.bbguild.log'
            - '@auth'
            - '@language'
            - '%avathar.bbguild.tables.bb_players%'
            - '%avathar.bbguild.tables.bb_guild%'
            - '%avathar.bbguild.tables.bb_games%'

    avathar.bbguildwow.achievement:
        class: avathar\bbguildwow\model\achievement
        arguments:
            - '@dbal.conn'
            - '@cache'
            - '@avathar.bbguild.util'
            - '%avathar.bbguildwow.tables.bb_achievement_track%'
            - '%avathar.bbguildwow.tables.bb_achievement%'
            - '%avathar.bbguildwow.tables.bb_achievement_rewards%'
            - '%avathar.bbguildwow.tables.bb_criteria_track%'
            - '%avathar.bbguildwow.tables.bb_achievement_criteria%'
            - '%avathar.bbguildwow.tables.bb_relations_table%'
            - '%avathar.bbguildwow.tables.bb_guild_wow%'
            - '%avathar.bbguildwow.tables.bb_achievement_category%'
        calls:
            - [set_language, ['@language']]

    # --- Controllers ---

    avathar.bbguildwow.achievement_sync_controller:
        class: avathar\bbguildwow\controller\achievement_sync_controller
        arguments:
            - '@avathar.bbguildwow.achievement'
            - '@dbal.conn'
            - '@avathar.bbguild.log'
            - '@auth'
            - '@language'
            - '%avathar.bbguild.tables.bb_guild%'
            - '%avathar.bbguild.tables.bb_games%'
            - '%avathar.bbguildwow.tables.bb_achievement%'

    avathar.bbguildwow.achievement_controller:
        class: avathar\bbguildwow\controller\achievement_controller
        arguments:
            - '@avathar.bbguildwow.achievement'
            - '@dbal.conn'
            - '@request'
            - '@language'
            - '%avathar.bbguildwow.tables.bb_achievement%'
            - '%avathar.bbguildwow.tables.bb_achievement_track%'
            - '%avathar.bbguildwow.tables.bb_achievement_category%'
            - '%avathar.bbguildwow.tables.bb_relations_table%'
            - '%avathar.bbguildwow.tables.bb_achievement_criteria%'
            - '%avathar.bbguildwow.tables.bb_criteria_track%'

    avathar.bbguildwow.character_stats_controller:
        class: avathar\bbguildwow\controller\character_stats_controller
        arguments:
            - '@auth'
            - '@avathar.bbguildwow.api'
            - '@dbal.conn'
            - '%avathar.bbguild.tables.bb_players%'
            - '%avathar.bbguild.tables.bb_guild%'
            - '@language'

    # --- Player detail tabs ---

    avathar.bbguildwow.player_detail_tab.pvp:
        class: avathar\bbguildwow\portal\player_detail_tabs\pvp_tab
        arguments:
            - '@avathar.bbguildwow.api'
            - '@dbal.conn'
            - '@template'
            - '%avathar.bbguild.tables.bb_players%'
            - '%avathar.bbguild.tables.bb_guild%'
        tags:
            - { name: bbguild.player_detail_tab }

    avathar.bbguildwow.player_detail_tab.talents:
        class: avathar\bbguildwow\portal\player_detail_tabs\talents_tab
        arguments:
            - '@template'
            - '@language'
        tags:
            - { name: bbguild.player_detail_tab }

    avathar.bbguildwow.player_detail_tab.raid_progression:
        class: avathar\bbguildwow\portal\player_detail_tabs\raid_progression_tab
        arguments:
            - '@template'
            - '@language'
        tags:
            - { name: bbguild.player_detail_tab }

    avathar.bbguildwow.player_detail_tab.achievements:
        class: avathar\bbguildwow\portal\player_detail_tabs\achievements_tab
        arguments:
            - '@avathar.bbguildwow.achievement'
            - '@template'
        tags:
            - { name: bbguild.player_detail_tab }

    # --- Portal modules ---

    avathar.bbguildwow.portal.module.achievements:
        class: avathar\bbguildwow\portal\modules\achievements
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@template'
            - '@controller.helper'
            - '%avathar.bbguildwow.tables.bb_achievement%'
            - '%avathar.bbguildwow.tables.bb_achievement_track%'
            - '%avathar.bbguildwow.tables.bb_guild_wow%'
            - '@avathar.bbguildwow.achievement'
        tags:
            - { name: bbguild.portal.module }

    # --- Cron ---

    avathar.bbguildwow.cron.task.sync_guild:
        class: avathar\bbguildwow\cron\task\sync_guild
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@avathar.bbguild.log'
            - '@avathar.bbguildwow.api'
            - '%avathar.bbguild.tables.bb_guild%'
            - '%avathar.bbguild.tables.bb_games%'
        calls:
            - [set_name, ['avathar.bbguildwow.cron.task.sync_guild']]
        tags:
            - { name: cron.task }

    avathar.bbguildwow.portal.module.guild_news:
        class: avathar\bbguildwow\portal\modules\guild_news
        arguments:
            - '@dbal.conn'
            - '@template'
            - '%avathar.bbguild.tables.bb_news%'
            - '%avathar.bbguildwow.tables.bb_guild_wow%'
        tags:
            - { name: bbguild.portal.module }
